<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Waretec</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header con Menú Navegación -->
    <header class="navbar">
        <div class="logo">
            <img src="Logo_empresa.png" alt="Waretec Logo" class="logo-img">
            <span class="logo-text">Waretec</span>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#nosotros">Nosotros</a></li>
                <li><a href="index.html#servicios">Servicios</a></li>
                <li><a href="galeria.html">Catálogo</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contacto-section">
        <div class="container">
            <div class="form-container">
                <h1>Contáctanos</h1>
                <p class="form-subtitle">Escribinos y potenciá tu negocio hoy mismo.</p>
                
                <!-- Formulario Completo de 5 Campos Distintos -->
                <form action="#" method="POST" class="main-form">
                    
                    <!-- Campo 1: Nombre de la Empresa / Particular -->
                    <div class="form-group">
                        <label for="name">1. Nombre de la Empresa / Nombre Particular</label>
                        <input type="text" id="name" name="name" required placeholder="Ej. Mi Pyme S.R.L.">
                    </div>

                    <div class="form-row">
                        <!-- Campo 2: Email -->
                        <div class="form-group">
                            <label for="email">2. Correo Electrónico</label>
                            <input type="email" id="email" name="email" required placeholder="nombre@empresa.com">
                        </div>

                        <!-- Campo 3: Teléfono -->
                        <div class="form-group">
                            <label for="phone">3. Teléfono de Contacto</label>
                            <input type="tel" id="phone" name="phone" required placeholder="Ej. +54 351 0000000">
                        </div>
                    </div>

                    <!-- Campo 4: Tipo de Servicio -->
                    <div class="form-group">
                        <label for="service-type">4. Tipo de Servicio Requerido</label>
                        <select id="service-type" name="service-type" required>
                            <option value="" disabled selected>Seleccioná una opción...</option>
                            <option value="landing">Diseño Web Institucional / Landing Page</option>
                            <option value="ecommerce">Tienda Online / E-Commerce</option>
                            <option value="mantenimiento">Mantenimiento y Actualizaciones</option>
                            <option value="marketing">Estrategia de Marketing Digital</option>
                        </select>
                    </div>

                    <!-- Campo 5: Mensaje / Detalle -->
                    <div class="form-group">
                        <label for="message">5. Detalle del Proyecto</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Contanos sobre tu negocio y qué características necesitás en tu web..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <p><strong>Waretec</strong> - Soluciones Digitales para Pymes</p>
                <p>&copy; 2026 Waretec. Todos los derechos reservados.</p>
            </div>
            <div class="footer-contact">
                <p>📍 Córdoba, Argentina</p>
                <p>✉️ contacto@waretec.com</p>
                <p>📞 +54 351 123-4567</p>
            </div>
        </div>
    </footer>

</body>
</html>
